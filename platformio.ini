; SOFIA Maestro firmware
;
; Build:   pio run -e <env>
; Flash:   pio run -e <env> -t upload
; Monitor: pio device monitor
;
; Both envs target the classic ESP32 (ESP-WROOM-32 module); they differ only
; in board details such as pin names. default_envs is what plain `pio run`
; builds.

[platformio]
default_envs = esp32dev
; Keep toolchains and frameworks inside the project (gitignored), so
; deleting the folder removes everything.
core_dir = .platformio

[env]
platform = espressif32@7.1.3
framework = arduino
monitor_speed = 115200
build_flags = -Wall

; Generic ESP32-WROOM-32 dev board (used for testing)
[env:esp32dev]
board = esp32dev

; NodeMCU-32S (the board planned for SOFIA)
[env:nodemcu-32s]
board = nodemcu-32s
